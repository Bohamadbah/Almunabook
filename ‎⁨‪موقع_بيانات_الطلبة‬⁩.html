<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السجل الشامل لبيانات الطلبة</title>
<style>
  :root{
    --ink:#1c2b28;
    --ink-soft:#4d5f5a;
    --bg:#f4f1e9;
    --surface:#ffffff;
    --line:#e1dccd;
    --primary:#12433c;
    --primary-light:#1f5c53;
    --accent:#b3542e;
    --accent-soft:#f1e2d4;
    --good:#3a6b52;
    --good-bg:#e7efe8;
    --warn:#a13a2e;
    --warn-bg:#f6e4df;
    --mid:#9c7a2c;
    --mid-bg:#f4ecd8;
    --radius:10px;
    --shadow: 0 1px 2px rgba(28,43,40,.06), 0 6px 20px rgba(28,43,40,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Segoe UI","Tahoma","Arial",sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:28px 22px 60px;}

  header.top{
    display:flex;justify-content:space-between;align-items:flex-end;
    gap:18px;flex-wrap:wrap;
    border-bottom:2px solid var(--primary);
    padding-bottom:18px;margin-bottom:22px;
  }
  header.top h1{
    font-size:26px;margin:0 0 6px;color:var(--primary);
    letter-spacing:.2px;font-weight:700;
  }
  header.top p.meta{margin:0;color:var(--ink-soft);font-size:13.5px;}
  .badge-count{
    background:var(--primary);color:#fff;border-radius:999px;
    padding:8px 18px;font-size:14px;font-weight:600;white-space:nowrap;
  }

  .stats-row{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;margin-bottom:22px;
  }
  .stat-card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 16px;
    box-shadow:var(--shadow);
  }
  .stat-card .num{font-size:22px;font-weight:700;color:var(--primary);}
  .stat-card .lbl{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

  .controls{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow);margin-bottom:18px;
  }
  .controls-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .search-box{flex:1 1 260px;position:relative;}
  .search-box input{
    width:100%;padding:11px 14px;border:1px solid var(--line);
    border-radius:8px;font-size:14.5px;background:#fbfaf6;color:var(--ink);
    font-family:inherit;
  }
  .search-box input:focus{outline:2px solid var(--primary-light);outline-offset:1px;}
  select{
    padding:10px 12px;border:1px solid var(--line);border-radius:8px;
    background:#fbfaf6;color:var(--ink);font-size:14px;font-family:inherit;
    min-width:140px;
  }
  select:focus{outline:2px solid var(--primary-light);outline-offset:1px;}
  .result-note{font-size:13px;color:var(--ink-soft);margin-top:10px;}
  .clear-btn{
    background:none;border:1px solid var(--line);border-radius:8px;
    padding:10px 14px;font-size:13.5px;color:var(--ink-soft);cursor:pointer;
    font-family:inherit;
  }
  .clear-btn:hover{border-color:var(--accent);color:var(--accent);}

  .table-shell{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);
  }
  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead th{
    text-align:right;padding:12px 14px;background:var(--primary);color:#fff;
    font-weight:600;font-size:13px;position:sticky;top:0;
  }
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line);}
  tbody tr{cursor:pointer;transition:background .12s;}
  tbody tr:hover{background:var(--accent-soft);}
  tbody tr:last-child td{border-bottom:none;}
  .idcell{font-weight:600;color:var(--primary);letter-spacing:.3px;}
  .pill{
    display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;
  }
  .pill.accepted{background:var(--good-bg);color:var(--good);}
  .pill.progress{background:var(--mid-bg);color:var(--mid);}
  .empty-state{padding:50px 20px;text-align:center;color:var(--ink-soft);}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(20,30,28,.55);
    display:none;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--surface);border-radius:14px;max-width:760px;width:100%;
    max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .modal-head{
    background:var(--primary);color:#fff;padding:20px 26px;
    border-radius:14px 14px 0 0;position:sticky;top:0;
    display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
  }
  .modal-head h2{margin:0 0 4px;font-size:19px;font-weight:700;}
  .modal-head .sub{font-size:13px;opacity:.85;}
  .modal-close{
    background:rgba(255,255,255,.15);border:none;color:#fff;
    width:32px;height:32px;border-radius:8px;font-size:18px;cursor:pointer;
    flex-shrink:0;line-height:1;
  }
  .modal-close:hover{background:rgba(255,255,255,.3);}
  .modal-body{padding:22px 26px 30px;}
  .section{margin-bottom:22px;}
  .section:last-child{margin-bottom:0;}
  .section h3{
    font-size:13.5px;color:var(--accent);margin:0 0 10px;font-weight:700;
    border-bottom:1px solid var(--line);padding-bottom:7px;
  }
  .field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;}
  .field{display:flex;flex-direction:column;gap:2px;}
  .field .k{font-size:12px;color:var(--ink-soft);}
  .field .v{font-size:14.5px;color:var(--ink);font-weight:600;}
  .field .v.empty{color:#b7b2a3;font-weight:400;font-style:normal;}
  .flag-yes{color:var(--warn);}
  .note-box{
    background:var(--warn-bg);border:1px solid #e3c6ba;border-radius:8px;
    padding:10px 14px;font-size:13.5px;color:var(--warn);margin-top:8px;
  }

  footer.foot{
    text-align:center;color:var(--ink-soft);font-size:12.5px;margin-top:26px;
  }

  @media (max-width:640px){
    .wrap{padding:18px 14px 40px;}
    header.top h1{font-size:21px;}
    thead th:nth-child(4),thead th:nth-child(5),tbody td:nth-child(4),tbody td:nth-child(5){display:none;}
    table{font-size:13px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>السجل الشامل لبيانات الطلبة</h1>
      <p class="meta">أداة قراءة للإدارة والإشراف — تحديث 09-09-2026</p>
    </div>
    <div class="badge-count" id="totalBadge">— طالب</div>
  </header>

  <div class="stats-row" id="statsRow"></div>

  <div class="controls">
    <div class="controls-row">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث بالرقم الشخصي أو اسم الطالب...">
      </div>
      <select id="gradeFilter"><option value="">كل الصفوف</option></select>
      <select id="sectionFilter"><option value="">كل الفرق</option></select>
      <select id="statusFilter"><option value="">كل حالات الطلب</option></select>
      <button class="clear-btn" id="clearBtn">مسح الفلاتر</button>
    </div>
    <p class="result-note" id="resultNote"></p>
  </div>

  <div class="table-shell">
    <table>
      <thead>
        <tr>
          <th>الرقم الشخصي</th>
          <th>اسم الطالب</th>
          <th>الجنسية</th>
          <th>الصف</th>
          <th>الفرقة</th>
          <th>حالة الطلب</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none;">لا توجد نتائج مطابقة للبحث.</div>
  </div>

  <footer class="foot">اضغط على أي صف لعرض جميع بيانات الطالب بشكل منظم — بيانات للاستخدام الإداري الداخلي فقط.</footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
const STUDENTS = JSON.parse(document.getElementById('studentsData').textContent);

const F = {
  id:'الرقم الشخصي', name:'اسم الطالب', nat:'الجنسية', grade:'الصف', section:'الفرقة',
  phoneStudentAdmin:'هاتف الطالب سجلات الإدارة',
  phoneGuardianAdmin:'هاتف ولي الأمر سجلات الإدارة',
  phoneWorkAdmin:'هاتف العمل سجلات الإدارة',
  phoneOtherAdmin:'هاتف آخر سجلات الإدارة',
  transportAdmin:'وسيلة الانتقال سجلات الإدارة',
  financialStatus:'الحالة المادية',
  phoneContactForm:'هاتف التواصل فورم',
  phoneWhatsappForm:'هاتف الوتساب فورم',
  apt:'شقة فورم', home:'المنزل فورم', road:'طريق فورم', block:'مجمع فورم',
  areaForm:'المنطقة فورم', transportForm:'وسيلة النقل فورم',
  siblingsForm:'عدد الاخوة فورم', orderInFamily:'ترتيب الطالب في الاسرة',
  siblingsGov:'عدد الاخوة الدراسين بالمدارس الحكومية',
  livesWith:'يعيش الطالب مع', familyLevel:'المستوى المادي للاسرة',
  needsHelp:'اذا كانت الحالة المادية ضعيفة الى يحتاج الطالب للمساعدة',
  chronicIllness:'هل يعاني الطالب من امراض مزمنة',
  illnessDetail:'اذا كان يعاني من مرض مزمن اذكر نوع المرض',
  formStatus:'سجلات الفورم',
  blockNum:'رقم المجمع', area:'المنطقة', requestStatus:'حالة الطلب',
  programTransport:'وسيلة الموصلات من البرنامج'
};

function val(rec, key){
  const v = rec[F[key]];
  if(v === '' || v === null || v === undefined) return '';
  return v;
}

function renderVal(rec, key){
  const v = val(rec, key);
  if(v === '') return '<span class="v empty">— غير مسجل —</span>';
  return `<span class="v">${escapeHtml(String(v))}</span>`;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---------- Stats ----------
function buildStats(){
  const total = STUDENTS.length;
  const grades = {};
  STUDENTS.forEach(r => {
    const g = val(r,'grade') || 'غير محدد';
    grades[g] = (grades[g]||0)+1;
  });
  const accepted = STUDENTS.filter(r => val(r,'requestStatus') === 'مقبول').length;
  const chronic = STUDENTS.filter(r => (val(r,'chronicIllness')||'').startsWith('نعم')).length;

  document.getElementById('totalBadge').textContent = total + ' طالب';

  const statsRow = document.getElementById('statsRow');
  const cards = [
    {num: total, lbl:'إجمالي الطلبة'},
    ...Object.entries(grades).map(([g,c]) => ({num:c, lbl:g})),
    {num: chronic, lbl:'يعانون من أمراض مزمنة'}
  ];
  statsRow.innerHTML = cards.map(c => `
    <div class="stat-card">
      <div class="num">${c.num}</div>
      <div class="lbl">${escapeHtml(c.lbl)}</div>
    </div>`).join('');
}

// ---------- Filters ----------
function uniqueSorted(key){
  return [...new Set(STUDENTS.map(r => val(r,key)).filter(v => v !== ''))].sort();
}

function populateFilters(){
  const gradeSel = document.getElementById('gradeFilter');
  uniqueSorted('grade').forEach(g => {
    gradeSel.innerHTML += `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`;
  });
  const statusSel = document.getElementById('statusFilter');
  uniqueSorted('requestStatus').forEach(s => {
    statusSel.innerHTML += `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`;
  });
  refreshSectionOptions();
}

function refreshSectionOptions(){
  const gradeVal = document.getElementById('gradeFilter').value;
  const sectionSel = document.getElementById('sectionFilter');
  const pool = gradeVal ? STUDENTS.filter(r => val(r,'grade')===gradeVal) : STUDENTS;
  const sections = [...new Set(pool.map(r=>val(r,'section')).filter(v=>v!==''))].sort();
  const current = sectionSel.value;
  sectionSel.innerHTML = '<option value="">كل الفرق</option>' +
    sections.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
  if(sections.includes(current)) sectionSel.value = current;
}

// ---------- Table ----------
function pillHtml(status){
  if(status === 'مقبول') return `<span class="pill accepted">${status}</span>`;
  if(status === 'قيد الدراسة') return `<span class="pill progress">${status}</span>`;
  return status ? escapeHtml(status) : '<span style="color:#b7b2a3;">—</span>';
}

function matchesFilters(r){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const grade = document.getElementById('gradeFilter').value;
  const section = document.getElementById('sectionFilter').value;
  const status = document.getElementById('statusFilter').value;

  if(grade && val(r,'grade') !== grade) return false;
  if(section && val(r,'section') !== section) return false;
  if(status && val(r,'requestStatus') !== status) return false;

  if(q){
    const name = String(val(r,'name')).toLowerCase();
    const id = String(val(r,'id')).toLowerCase();
    if(!name.includes(q) && !id.includes(q)) return false;
  }
  return true;
}

function renderTable(){
  const body = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');
  const filtered = STUDENTS.filter(matchesFilters);

  document.getElementById('resultNote').textContent =
    `عرض ${filtered.length} من ${STUDENTS.length} طالب`;

  if(filtered.length === 0){
    body.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  body.innerHTML = filtered.map(r => `
    <tr data-id="${escapeHtml(String(val(r,'id')))}">
      <td class="idcell">${escapeHtml(String(val(r,'id')))}</td>
      <td>${escapeHtml(String(val(r,'name')))}</td>
      <td>${escapeHtml(String(val(r,'nat')))}</td>
      <td>${escapeHtml(String(val(r,'grade')))}</td>
      <td>${escapeHtml(String(val(r,'section')))}</td>
      <td>${pillHtml(val(r,'requestStatus'))}</td>
    </tr>
  `).join('');

  body.querySelectorAll('tr').forEach(tr => {
    tr.addEventListener('click', () => openModal(tr.dataset.id));
  });
}

// ---------- Modal ----------
function fieldHtml(label, key){
  return `<div class="field"><span class="k">${escapeHtml(label)}</span>${renderVal.__rec ? '' : ''}${renderValFor(key)}</div>`;
}

let CURRENT_REC = null;
function renderValFor(key){
  return renderVal(CURRENT_REC, key);
}

function openModal(id){
  const rec = STUDENTS.find(r => String(val(r,'id')) === String(id));
  if(!rec) return;
  CURRENT_REC = rec;

  const chronic = (val(rec,'chronicIllness')||'').startsWith('نعم');
  const needsHelp = val(rec,'needsHelp') === 'نعم';

  const html = `
    <div class="modal-head">
      <div>
        <h2>${escapeHtml(String(val(rec,'name')))}</h2>
        <div class="sub">الرقم الشخصي: ${escapeHtml(String(val(rec,'id')))} · ${escapeHtml(String(val(rec,'grade')))} — ${escapeHtml(String(val(rec,'section')))}</div>
      </div>
      <button class="modal-close" id="closeBtn" aria-label="إغلاق">✕</button>
    </div>
    <div class="modal-body">

      <div class="section">
        <h3>البيانات الأساسية</h3>
        <div class="field-grid">
          ${fieldHtml('اسم الطالب','name')}
          ${fieldHtml('الرقم الشخصي','id')}
          ${fieldHtml('الجنسية','nat')}
          ${fieldHtml('الصف','grade')}
          ${fieldHtml('الفرقة','section')}
          ${fieldHtml('حالة الطلب','requestStatus')}
        </div>
      </div>

      <div class="section">
        <h3>أرقام الهواتف — سجلات الإدارة</h3>
        <div class="field-grid">
          ${fieldHtml('هاتف الطالب','phoneStudentAdmin')}
          ${fieldHtml('هاتف ولي الأمر','phoneGuardianAdmin')}
          ${fieldHtml('هاتف العمل','phoneWorkAdmin')}
          ${fieldHtml('هاتف آخر','phoneOtherAdmin')}
        </div>
      </div>

      <div class="section">
        <h3>أرقام الهواتف — استمارة البيانات</h3>
        <div class="field-grid">
          ${fieldHtml('هاتف التواصل','phoneContactForm')}
          ${fieldHtml('هاتف الواتساب','phoneWhatsappForm')}
        </div>
      </div>

      <div class="section">
        <h3>العنوان والمواصلات</h3>
        <div class="field-grid">
          ${fieldHtml('المنطقة (سجلات)','area')}
          ${fieldHtml('المنطقة (فورم)','areaForm')}
          ${fieldHtml('رقم المجمع','blockNum')}
          ${fieldHtml('مجمع (فورم)','block')}
          ${fieldHtml('طريق','road')}
          ${fieldHtml('المنزل','home')}
          ${fieldHtml('شقة','apt')}
          ${fieldHtml('وسيلة الانتقال (سجلات الإدارة)','transportAdmin')}
          ${fieldHtml('وسيلة النقل (فورم)','transportForm')}
          ${fieldHtml('وسيلة الموصلات من البرنامج','programTransport')}
        </div>
      </div>

      <div class="section">
        <h3>البيانات الأسرية والمادية</h3>
        <div class="field-grid">
          ${fieldHtml('الحالة المادية (سجلات)','financialStatus')}
          ${fieldHtml('المستوى المادي للأسرة (فورم)','familyLevel')}
          ${fieldHtml('يعيش الطالب مع','livesWith')}
          ${fieldHtml('عدد الإخوة (فورم)','siblingsForm')}
          ${fieldHtml('ترتيب الطالب في الأسرة','orderInFamily')}
          ${fieldHtml('عدد الإخوة بالمدارس الحكومية','siblingsGov')}
        </div>
        ${needsHelp ? '<div class="note-box">الأسرة بحالة مادية ضعيفة وتحتاج الطالب إلى مساعدة</div>' : ''}
      </div>

      <div class="section">
        <h3>البيانات الصحية</h3>
        <div class="field-grid">
          <div class="field">
            <span class="k">هل يعاني الطالب من أمراض مزمنة</span>
            <span class="v ${chronic ? 'flag-yes' : ''}">${escapeHtml(String(val(rec,'chronicIllness')) || '— غير مسجل —')}</span>
          </div>
        </div>
        ${chronic && val(rec,'illnessDetail') ? `<div class="note-box">${escapeHtml(String(val(rec,'illnessDetail')))}</div>` : ''}
      </div>

      <div class="section">
        <h3>حالة استمارة البيانات</h3>
        <div class="field-grid">
          ${fieldHtml('سجلات الفورم','formStatus')}
        </div>
      </div>

    </div>
  `;

  document.getElementById('modal').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('closeBtn').addEventListener('click', closeModal);
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
}

document.getElementById('overlay').addEventListener('click', (e) => {
  if(e.target.id === 'overlay') closeModal();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closeModal();
});

// ---------- Wire up controls ----------
document.getElementById('searchInput').addEventListener('input', renderTable);
document.getElementById('gradeFilter').addEventListener('change', () => { refreshSectionOptions(); renderTable(); });
document.getElementById('sectionFilter').addEventListener('change', renderTable);
document.getElementById('statusFilter').addEventListener('change', renderTable);
document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  document.getElementById('gradeFilter').value = '';
  document.getElementById('sectionFilter').value = '';
  document.getElementById('statusFilter').value = '';
  refreshSectionOptions();
  renderTable();
});

// ---------- Init ----------
buildStats();
populateFilters();
renderTable();
</script>
</body>
</html>
